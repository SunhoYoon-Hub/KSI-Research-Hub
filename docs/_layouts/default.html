<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'ko-KR' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#081526">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#content">본문으로 건너뛰기</a>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="KSI Research Hub 홈">
        <span class="brand-mark" aria-hidden="true">K<span>Σ</span>I</span>
        <span class="brand-copy">
          <strong>KSI Research Hub</strong>
          <small>Student Research Community</small>
        </span>
      </a>
      <nav class="site-nav" aria-label="주요 메뉴">
        <a href="{{ '/' | relative_url }}#research">연구</a>
        <a href="{{ '/' | relative_url }}#process">과정</a>
        <a href="https://github.com/SunhoYoon-Hub/KSI-Research-Hub">GitHub</a>
      </nav>
    </header>

    <main id="content" class="page-shell">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div>
        <strong>KSI Research Hub</strong>
        <span>학생 연구의 구상·검토·개정·공개를 연결합니다.</span>
      </div>
      <div class="footer-links">
        <a href="{{ '/privacy/' | relative_url }}">개인정보 보호</a>
        <a href="https://github.com/SunhoYoon-Hub/KSI-Research-Hub">Repository</a>
        <span>Established 2026</span>
      </div>
    </footer>
  </body>
</html>
