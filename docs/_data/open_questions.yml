- id: language-rules
  code: "Q-01"
  question: "언어의 규칙은 명령에서 시작되는가, 사용 속에서 형성되는가?"
  note: "비트겐슈타인의 언어게임과 ‘석판’ 사례에서 출발한 질문입니다."
  keywords:
    - "언어철학"
    - "비트겐슈타인"
    - "언어게임"

- id: freedom-cycle
  code: "Q-02"
  question: "개인의 자유 추구는 어떤 조건에서 공동의 자유를 약화시키는가?"
  note: "자유·무관심·이기주의와 사회 환경이 만드는 악순환의 구조를 살펴봅니다."
  keywords:
    - "사회철학"
    - "자유"
    - "악순환"

- id: truth-and-false-equivalence
  code: "Q-03"
  question: "진실과 거짓이 같은 무게로 취급될 때, 중립은 어떻게 왜곡으로 변하는가?"
  note: "진실의 외형적 무표지성과 거짓 등가성, 양비론의 문제를 검토합니다."
  keywords:
    - "인식론"
    - "거짓 등가성"
    - "양비론"

- id: excellence-and-common-norms
  code: "Q-04"
  question: "스스로 가치를 창조하는 탁월성은 공동체의 규범과 어떻게 공존할 수 있는가?"
  note: "자기 입법과 사회적 합의 사이의 긴장을 탐색합니다."
  keywords:
    - "니체"
    - "도덕철학"
    - "탁월성"
